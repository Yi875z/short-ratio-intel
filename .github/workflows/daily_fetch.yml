name: 空売り比率 定時取得・AIレポート生成

# トリガー:
#   1. Cloudflare Workers Cron（Worker 名 `jpx-report-scheduler`）からの workflow_dispatch。
#      平日 19:07 JST に起動される。空売り比率は日次公表なので、営業日夕方に
#      直近営業日分をまとめて取得する。
#      Worker のソースは別リポジトリにある: C:\CarSol\JPX_Analysis_System\scheduler#      （時刻を変えるのは src/index.js の SCHEDULE。JST 表記で書く）
#   2. Actions タブからの手動実行（同じ workflow_dispatch / スマホからも可）
#
# なぜ schedule: が無いのか（2026-09-02 削除。安易に戻さないこと）:
#   GitHub の schedule イベントは実測で 30分〜10時間 遅延した（本リポジトリでも
#   2026-08-28 は 19:07 JST 起動のはずが翌 06:09 JST に到着）。定刻起動は
#   Cloudflare Cron が担うため、同時刻の schedule は「大幅に遅れて届く二重実行」に
#   しかならず、Gemini 無料枠（20 req/日・モデル単位）を2倍消費していた。
#   workflow_dispatch: は Worker の入口なので絶対に消さないこと。
on:
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYY-MM-DD（空欄なら直近営業日をまとめて取得）'
        required: false
        type: string
      mode:
        description: '実行モード'
        required: false
        type: choice
        default: 'full'
        options:
          - full         # 取得 + 市場テーマ判定 + AIレポート生成（通常）
          - fetch-only   # データ取得のみ（テーマ/レポートをスキップ）
          - no-news      # Tavilyニュースを使わず内部データのみで作成

jobs:
  fetch:
    runs-on: ubuntu-latest
    # AIレポート生成の最悪ケースに合わせる。
    # config/settings.py の GEMINI_REQUEST_TIMEOUT_SEC(180秒) × MAX_RETRIES(3) × 退避先を含む
    # 3モデル ≒ 27分 + 取得処理。ここが短いと退避モデルへ到達する前に打ち切られ、
    # せっかくの自動退避が働かずレポートが欠落する（2026-08-25 に 20分から拡大）。
    timeout-minutes: 35

    env:
      TZ: Asia/Tokyo
      # --- 機密値はすべて GitHub Secrets から ---
      # Supabase(PostgreSQL) 接続文字列。これが設定されている限り SQLite ではなく Supabase に書く
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
      # 投資主体別フロー突合（姉妹プロジェクト jpx-analysis の別Supabase 読み取り）
      # 未設定なら機関フロー突合はスキップ（fail-soft）。
      JPX_ANALYSIS_SUPABASE_URL: ${{ secrets.JPX_ANALYSIS_SUPABASE_URL }}
      JPX_ANALYSIS_SUPABASE_KEY: ${{ secrets.JPX_ANALYSIS_SUPABASE_KEY }}
      # ※ 空売り比率の取得は stock-marketdata.com スクレイピング + JPX公開PDF で行う
      #   （jquants_client.py は名前に反しスクレイパー。J-Quants は使っていない）。
      #   Light プランでは業種別空売り比率API（/markets/short-ratio）が 403 のため、
      #   空売り比率の取得元は今後も JPX 公開PDF が正である。
      # J-Quants API v2（Light 以上）。騰落銘柄数・TOPIX騰落率・取引カレンダーに使う。
      # 未設定なら騰落銘柄数はスキップし、需給モニターに「未取得」と表示される
      # （fail-soft。パイプライン全体は止まらない）。
      JQUANTS_API_KEY:   ${{ secrets.JQUANTS_API_KEY }}
      # 任意: 完了/失敗サマリーの Slack 通知
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # 使用モデルは【あえてここに置かない】。config/settings.py の
      # GEMINI_MODEL_DEFAULT が唯一の正。ここに env を書くと settings.py の既定を
      # 上書きしてしまい、「既定だけ直したのに本番が変わらない」二重管理事故になる。
      # Free Tier の 20 req/日はモデル単位の枠だが、枯渇時は gemini_client が
      # GEMINI_FALLBACK_MODELS へ自動退避するので手当て不要（2026-08-25 に自動化）。

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          set -e
          MODE="${{ inputs.mode || 'full' }}"
          DATE_ARG="${{ inputs.date }}"
          ARGS=""
          if [ -n "$DATE_ARG" ]; then
            ARGS="$ARGS --date $DATE_ARG"
          fi
          case "$MODE" in
            fetch-only) ARGS="$ARGS --no-theme --no-report" ;;
            no-news)    ARGS="$ARGS --no-news" ;;
          esac
          echo "Mode: $MODE"
          echo "Date: ${DATE_ARG:-(auto)}"
          echo "TZ:   $TZ"; date
          echo "Run:  python -m scripts.fetch_short_ratio $ARGS"
          python -m scripts.fetch_short_ratio $ARGS

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: |
            logs/
            *.log
          retention-days: 14
          if-no-files-found: ignore
