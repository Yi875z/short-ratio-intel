name: 空売り比率 定時取得・AIレポート生成

# トリガー:
#   1. Cloudflare Workers Cron（Worker 名 `jpx-report-scheduler`）からの workflow_dispatch。
#      平日 19:07 JST に起動される。空売り比率は日次公表なので、営業日夕方に
#      直近営業日分をまとめて取得する。
#      Worker のソースは別リポジトリにある: C:\CarSol\JPX_Analysis_System\scheduler#      （時刻を変えるのは src/index.js の SCHEDULE。JST 表記で書く）
#   2. Actions タブからの手動実行（同じ workflow_dispatch / スマホからも可）
#
# なぜ schedule: が無いのか（2026-09-02 削除。安易に戻さないこと）:
#   GitHub の schedule イベントは実測で 30分〜10時間 遅延した（本リポジトリでも
#   2026-08-28 は 19:07 JST 起動のはずが翌 06:09 JST に到着）。定刻起動は
#   Cloudflare Cron が担うため、同時刻の schedule は「大幅に遅れて届く二重実行」に
#   しかならず、Gemini 無料枠（20 req/日・モデル単位）を2倍消費していた。
#   workflow_dispatch: は Worker の入口なので絶対に消さないこと。
on:
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYY-MM-DD（空欄なら直近営業日をまとめて取得）'
        required: false
        type: string
      mode:
        description: '実行モード'
        required: false
        type: choice
        default: 'full'
        options:
          - full         # 取得 + 市場テーマ判定 + AIレポート生成（通常）
          - fetch-only   # データ取得のみ（テーマ/レポートをスキップ）
          - no-news      # Tavilyニュースを使わず内部データのみで作成
      source:
        # Worker(jpx-report-scheduler) は worker を渡す。Actions 画面からの手動実行は manual のまま。
        # guard は worker 由来の起動にだけ重複判定をかける（人の手動実行は常に通す）。
        description: '起動元（手動実行は manual のままでよい）'
        required: false
        default: manual
        type: string

jobs:
  # Worker の重複起動を弾くだけのジョブ（2026-09-30 追加）。
  # Worker は「予定時刻以降に実行が無ければ撃つ」追い付き方式だが、実行済みなのに
  # 追い付き時刻（分の1の位が7）で撃ち直す現象が続いている（9/28 は13回、9/29 は7回起動）。
  # 起動のたびに Gemini を最大9回呼ぶので、成功した日も枠を削り、9/28 夜は 429 まで達した。
  # Worker 側の原因は未確認。JPX_Analysis_System は 9/26 に同じガードで止めている。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      TZ: UTC   # 下の日付計算は UTC 前提。
    steps:
      - name: 直近の定時(19:07 JST)以降に実行済みかを判定
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.source }}" != "worker" ]; then
            echo "人の手動実行なので常に実行する（Worker 由来だけ重複判定する）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定時 19:07 JST = 10:07 UTC。直近のこの時刻以降に実行があれば当日ぶんは起動済み。
          # conclusion は問わない（失敗の自動リトライはしない。2026-05-26 の連続実行事故）。
          now=$(date -u +%s)
          boundary=$(date -u -d "$(date -u +%F) 10:07:00" +%s)
          if [ "$now" -lt "$boundary" ]; then
            boundary=$((boundary - 86400))
          fi
          since=$(date -u -d "@$boundary" +%Y-%m-%dT%H:%M:%SZ)
          # 自分より前に作られた run だけを数える（!= だと同時に起動した2本が互いを見て両方止まる）。
          # 照会自体が失敗したら「実行する」側に倒す。guard が落ちると定時の本処理ごと消えるため
          # （Worker も定時ちょうどは照会失敗でも撃つ側に倒している）。
          if ! n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily_fetch.yml/runs?branch=main&per_page=30" \
                --jq "[.workflow_runs[] | select(.created_at >= \"${since}\") | select(.id < ${GITHUB_RUN_ID})] | length"); then
            echo "::warning::実行履歴の照会に失敗。重複判定せずに実行する"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "基準時刻 ${since} 以降の既存実行: ${n} 件"
          if [ "$n" -gt 0 ]; then
            echo "すでに起動済みのため本処理をスキップする"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: guard
    # guard が失敗しても本処理は走らせる（needs の既定は success() が暗黙に付き、スキップされてしまう）
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # AIレポート生成の最悪ケースに合わせる。
    # config/settings.py の GEMINI_TOTAL_BUDGET_SEC(30分) が AI 生成全体の上限で、
    # 取得処理（実測 約6分）を足して 40分。ここが短いと退避モデルや2巡目へ到達する前に
    # 打ち切られ、レポートが欠落する（2026-08-25 に 20→35分、2026-09-30 に 40分）。
    timeout-minutes: 40

    env:
      TZ: Asia/Tokyo
      # --- 機密値はすべて GitHub Secrets から ---
      # Supabase(PostgreSQL) 接続文字列。これが設定されている限り SQLite ではなく Supabase に書く
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
      # 投資主体別フロー突合（姉妹プロジェクト jpx-analysis の別Supabase 読み取り）
      # 未設定なら機関フロー突合はスキップ（fail-soft）。
      JPX_ANALYSIS_SUPABASE_URL: ${{ secrets.JPX_ANALYSIS_SUPABASE_URL }}
      JPX_ANALYSIS_SUPABASE_KEY: ${{ secrets.JPX_ANALYSIS_SUPABASE_KEY }}
      # ※ 空売り比率の取得は stock-marketdata.com スクレイピング + JPX公開PDF で行う
      #   （jquants_client.py は名前に反しスクレイパー。J-Quants は使っていない）。
      #   Light プランでは業種別空売り比率API（/markets/short-ratio）が 403 のため、
      #   空売り比率の取得元は今後も JPX 公開PDF が正である。
      # J-Quants API v2（Light 以上）。騰落銘柄数・TOPIX騰落率・取引カレンダーに使う。
      # 未設定なら騰落銘柄数はスキップし、需給モニターに「未取得」と表示される
      # （fail-soft。パイプライン全体は止まらない）。
      JQUANTS_API_KEY:   ${{ secrets.JQUANTS_API_KEY }}
      # 任意: 完了/失敗サマリーの Slack 通知
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # 使用モデルは【あえてここに置かない】。config/settings.py の
      # GEMINI_MODEL_DEFAULT が唯一の正。ここに env を書くと settings.py の既定を
      # 上書きしてしまい、「既定だけ直したのに本番が変わらない」二重管理事故になる。
      # Free Tier の 20 req/日はモデル単位の枠だが、枯渇時は gemini_client が
      # GEMINI_FALLBACK_MODELS へ自動退避するので手当て不要（2026-08-25 に自動化）。

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          set -e
          MODE="${{ inputs.mode || 'full' }}"
          DATE_ARG="${{ inputs.date }}"
          ARGS=""
          if [ -n "$DATE_ARG" ]; then
            ARGS="$ARGS --date $DATE_ARG"
          fi
          case "$MODE" in
            fetch-only) ARGS="$ARGS --no-theme --no-report" ;;
            no-news)    ARGS="$ARGS --no-news" ;;
          esac
          # 定時起動（Worker）は保存済みのレポートを作り直さない。祝日の起動が前営業日の
          # レポートを退避モデルで上書きしていたため（人の手動実行には付けない）。
          if [ "${{ inputs.source }}" = "worker" ]; then
            ARGS="$ARGS --skip-existing-report"
          fi
          echo "Mode: $MODE"
          echo "Date: ${DATE_ARG:-(auto)}"
          echo "TZ:   $TZ"; date
          echo "Run:  python -m scripts.fetch_short_ratio $ARGS"
          python -m scripts.fetch_short_ratio $ARGS

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: |
            logs/
            *.log
          retention-days: 14
          if-no-files-found: ignore
