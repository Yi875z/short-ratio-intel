name: 米国ショートフロー 日次取得

# トリガー:
#   1. Cloudflare Workers Cron（Worker 名 `jpx-report-scheduler`）からの workflow_dispatch。
#      平日朝 08:37 JST に起動される。FINRA の当日ファイルは米東部18:00頃に公開され、
#      JST では夏時間で翌朝07:00・冬時間で08:00。冬時間でも間に合い、かつ東証の寄り
#      (09:00)前に読めるよう08:30台に置いている。
#      Worker のソースは別リポジトリにある: C:\CarSol\JPX_Analysis_System\scheduler#      （時刻を変えるのは src/index.js の SCHEDULE。JST 表記で書く）
#   2. Actions タブからの手動実行（同じ workflow_dispatch / スマホからも可）
#
# ⚠️ 日本側の daily_fetch.yml（19:07 JST・Gemini AIレポート）とは独立している。
#    こちらは Gemini を呼ばず、ルールベースでレポートを作る。
#
# なぜ schedule: が無いのか（2026-09-03 削除。安易に戻さないこと）:
#   GitHub の schedule イベントは実測 84分〜10時間 遅延する。08:37 に出す意味は
#   東証の寄り前に読めることなので、遅れるとレポートの価値そのものが落ちる。
#   定刻起動は Cloudflare Cron が担うため schedule: は不要。
#   workflow_dispatch: は Worker の入口なので絶対に消さないこと。
on:
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYY-MM-DD（空欄なら直近営業日を自動判定）'
        required: false
        type: string
      days:
        description: 'さかのぼる暦日数（既定5）'
        required: false
        type: string
      skip_price:
        description: '日足OHLCVの取得をスキップする'
        required: false
        type: boolean
        default: false
      source:
        # Worker(jpx-report-scheduler) は worker を渡す。Actions 画面からの手動実行は manual のまま。
        description: '起動元（手動実行は manual のままでよい）'
        required: false
        default: manual
        type: string

jobs:
  # Worker の重複起動を弾くだけのジョブ（2026-09-30 追加。経緯は daily_fetch.yml の guard を参照）。
  # こちらは Gemini を呼ばないが、9/29 08:37 の成功後にも 10:27・15:07 JST に撃ち直されていた。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      TZ: UTC   # 下の日付計算は UTC 前提。
    steps:
      - name: 直近の定時(08:37 JST)以降に実行済みかを判定
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.source }}" != "worker" ]; then
            echo "人の手動実行なので常に実行する（Worker 由来だけ重複判定する）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定時 08:37 JST = 前日 23:37 UTC。直近のこの時刻以降に実行があれば起動済み。
          now=$(date -u +%s)
          boundary=$(date -u -d "$(date -u +%F) 23:37:00" +%s)
          if [ "$now" -lt "$boundary" ]; then
            boundary=$((boundary - 86400))
          fi
          since=$(date -u -d "@$boundary" +%Y-%m-%dT%H:%M:%SZ)
          # 自分より前に作られた run だけを数える。照会失敗時は実行する側に倒す（daily_fetch.yml と同じ）。
          if ! n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/us_daily_fetch.yml/runs?branch=main&per_page=30" \
                --jq "[.workflow_runs[] | select(.created_at >= \"${since}\") | select(.id < ${GITHUB_RUN_ID})] | length"); then
            echo "::warning::実行履歴の照会に失敗。重複判定せずに実行する"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "基準時刻 ${since} 以降の既存実行: ${n} 件"
          if [ "$n" -gt 0 ]; then
            echo "すでに起動済みのため本処理をスキップする"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: guard
    # guard が失敗しても本処理は走らせる（needs の既定は success() が暗黙に付き、スキップされてしまう）
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Tokyo
      # Supabase(PostgreSQL) 接続文字列。未設定なら SQLite になり、
      # ランナー破棄とともにデータが消えるので必ず Secrets に入れておくこと。
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      # 任意: 完了/失敗サマリーの Slack 通知
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # ※ FINRA CNMS も Yahoo Finance chart API も認証不要。APIキーは追加不要。

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US pipeline
        run: |
          set -e
          ARGS=""
          DATE_ARG="${{ inputs.date }}"
          DAYS_ARG="${{ inputs.days }}"
          if [ -n "$DATE_ARG" ]; then
            ARGS="$ARGS --date $DATE_ARG"
          fi
          if [ -n "$DAYS_ARG" ]; then
            ARGS="$ARGS --days $DAYS_ARG"
          fi
          if [ "${{ inputs.skip_price }}" = "true" ]; then
            ARGS="$ARGS --no-price"
          fi
          echo "Date: ${DATE_ARG:-(auto)}"
          echo "TZ:   $TZ"; date
          echo "Run:  python -m scripts.fetch_us_short_flow $ARGS"
          python -m scripts.fetch_us_short_flow $ARGS

      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: us-short-flow-report-${{ github.run_id }}
          path: data/reports/*_us_short_flow.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: |
            logs/
            *.log
          retention-days: 14
          if-no-files-found: ignore
